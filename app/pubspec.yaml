name: birthday_app
description: A family-focused birthday and anniversary reminder app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Database (Offline-first)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Firebase (Auth & Notifications)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_messaging: ^14.7.9

  # Apple Sign In
  sign_in_with_apple: ^5.0.0

  # Google Sign In
  google_sign_in: ^6.1.6

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # UI Components
  intl: ^0.18.1
  table_calendar: ^3.0.9

  # Local Notifications
  flutter_local_notifications: ^16.3.0

  # Device Calendar Integration
  device_calendar: ^4.5.1

  # Contacts Import
  contacts_service: ^0.6.3
  permission_handler: ^11.1.0

  # Utilities
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.0

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # assets:
  #   - images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
